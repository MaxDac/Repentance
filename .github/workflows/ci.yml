name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  DOTNET_VERSION: 10.0.x

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Includes StoryIntegrityTests and InkWalkTests; the project downloads the Ink compiler (GodotInk.props).
      - name: Unit tests
        run: tools/run/test.sh unit --no-clean

  art-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Art generator dependencies
        run: python -m pip install pillow numpy
      - name: Art tests
        run: tools/run/test.sh art --no-clean

  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [autoplay, settings, pause, walk, playthrough]
    name: godot-tests (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-editor-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null

      - name: Locate Godot
        run: |
          godot="$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n1)"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          "$godot" --headless --version

      # tools/run/test.sh resets, builds, imports and runs the suite with the same pass rule as a local run: the
      # marker printed, exit status 0, and no ERROR / SCRIPT ERROR / USER ERROR / Unhandled exception lines.
      # Not --headless: AutoPlay captures viewport screenshots, which need a real renderer.
      - name: Run ${{ matrix.suite }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GODOT_FLAGS: --rendering-driver opengl3
        run: timeout 30m xvfb-run -a -s "-screen 0 1280x720x24" tools/run/test.sh ${{ matrix.suite }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: godot-tests-${{ matrix.suite }}
          path: |
            logs/
            screenshots/
          if-no-files-found: ignore
