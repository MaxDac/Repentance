name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/Repentance.Tests/Repentance.Tests.csproj --configuration Release
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Art generator dependencies
        run: python -m pip install pillow numpy
      - name: Art regression tests
        run: python -m unittest discover -s tests/art -v
