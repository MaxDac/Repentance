name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  DOTNET_VERSION: 10.0.x

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Includes StoryIntegrityTests and InkWalkTests; the project downloads the Ink compiler (GodotInk.props).
      - name: Unit tests
        run: tools/run/test.sh unit --no-clean
      - name: Launcher regression tests
        shell: pwsh
        run: python3 -m unittest discover -s tests -p test_run_scripts.py -v

  art-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Art generator dependencies
        run: python -m pip install pillow numpy
      - name: Art tests
        run: tools/run/test.sh art --no-clean

  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [autoplay, settings, pause, walk, playthrough]
    name: godot-tests (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null

      # tools/run/test.sh resets, builds, imports and runs the suite with the same pass rule as a local run: the
      # marker printed, exit status 0, and no ERROR / SCRIPT ERROR / USER ERROR / Unhandled exception lines.
      # Not --headless: AutoPlay captures viewport screenshots, which need a real renderer.
      - name: Run ${{ matrix.suite }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GODOT_FLAGS: --rendering-driver opengl3
        run: timeout 30m xvfb-run -a -s "-screen 0 1280x720x24" tools/run/test.sh ${{ matrix.suite }}

      # Fresh launches: each run loads a checkpoint the playthrough just kept (end of Act One, Club vestibule) and
      # plays a route to "The End", so state a save forgets cannot survive in memory as it does in-process.
      - name: Resume from saves in fresh launches
        if: matrix.suite == 'playthrough'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GODOT_FLAGS: --rendering-driver opengl3
        run: timeout 20m xvfb-run -a -s "-screen 0 1280x720x24" tools/run/test.sh resume-act2 resume-act3 --no-clean

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: godot-tests-${{ matrix.suite }}
          path: |
            logs/
            screenshots/
          if-no-files-found: ignore

  # Exports the game the way release.yml ships it, so a broken export fails the PR rather than the release.
  # The Linux build is then run through the walk test (every room, every hotspot), proving the exported
  # build boots, loads its C# assembly and every scene.
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            preset: Linux
            binary: Repentance.x86_64
          - platform: windows
            preset: Windows Desktop
            binary: Repentance.exe
    name: export (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: 'true'

      - name: Build C# and import assets
        run: |
          set -euo pipefail
          dotnet build Repentance.csproj
          "$GODOT" --headless --path . --import

      - name: Export ${{ matrix.preset }}
        run: |
          set -euo pipefail
          mkdir -p build/${{ matrix.platform }}
          "$GODOT" --headless --path . --export-release "${{ matrix.preset }}" "build/${{ matrix.platform }}/${{ matrix.binary }}"
          ls -la build/${{ matrix.platform }}
          test -f "build/${{ matrix.platform }}/${{ matrix.binary }}"
          # Godot exits 0 even when the C# export step fails; the .NET data folder proves it ran.
          ls -d build/${{ matrix.platform }}/data_Repentance_* >/dev/null
          # Linux ships the desktop entry, its icons and the installer next to the binary (as release.yml does).
          if [ "${{ matrix.platform }}" = linux ]; then cp -r dist/linux/. build/linux/; fi

      - name: Windows icon is embedded in the .exe
        if: matrix.platform == 'windows'
        shell: python
        run: |
          import struct, sys
          ico = open("assets/art/ui/icon.ico", "rb").read()
          exe = open("build/windows/Repentance.exe", "rb").read()
          count = struct.unpack_from("<H", ico, 4)[0]
          missing = []
          for i in range(count):
              w, h, _, _, _, _, size, offset = struct.unpack_from("<BBBBHHII", ico, 6 + 16 * i)
              if ico[offset:offset + size] not in exe:
                  missing.append(w or 256)
          if missing:
              print(f"::error::icon frames {missing} are not in Repentance.exe")
              sys.exit(1)
          print(f"all {count} icon frames are embedded")

      - name: Linux desktop integration installs
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils > /dev/null
          desktop-file-validate dist/linux/Repentance.desktop
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg"
          test -x build/linux/install-desktop.sh
          build/linux/install-desktop.sh
          entry="$XDG_DATA_HOME/applications/Repentance.desktop"
          desktop-file-validate "$entry"
          grep -qx "Exec=\"$PWD/build/linux/Repentance.x86_64\"" "$entry"
          grep -qx "Path=$PWD/build/linux" "$entry"
          for s in 16 32 48 64 128 256; do test -f "$XDG_DATA_HOME/icons/hicolor/${s}x${s}/apps/repentance.png"; done
          build/linux/install-desktop.sh --uninstall
          test ! -e "$entry"
          test ! -e "$XDG_DATA_HOME/icons/hicolor/256x256/apps/repentance.png"

      - name: Install virtual display and software OpenGL
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null

      - name: Walk test on the exported build
        if: matrix.platform == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -uo pipefail
          mkdir -p logs
          log=logs/export-walk.log
          timeout 15m xvfb-run -a -s "-screen 0 1280x720x24" build/linux/Repentance.x86_64 \
            --rendering-driver opengl3 --audio-driver Dummy -- --walk-test 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          ok=0
          [ "$status" -eq 0 ] || { echo "::error::exported build exited with status $status"; ok=1; }
          grep -qF "WALK TEST OK" "$log" || { echo "::error::WALK TEST OK not printed by the exported build"; ok=1; }
          if grep -nE '^(ERROR|SCRIPT ERROR|USER ERROR):|Unhandled exception' "$log"; then
            echo "::error::the exported build logged errors"; ok=1
          fi
          exit $ok

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: export-${{ matrix.platform }}
          path: logs/
          if-no-files-found: ignore

  # The single check to require on main (branch protection / ruleset): green only when every job above passed.
  ci-ok:
    if: always()
    needs: [unit-tests, art-tests, godot-tests, export]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required CI job did not succeed ($r)"; exit 1; }; done