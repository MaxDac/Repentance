name: Set up Godot .NET
description: Installs (and caches) the Godot .NET editor for Linux, optionally with its export templates, and sets GODOT to the binary.

inputs:
  version:
    description: Godot version, e.g. 4.7.2
    required: true
  export-templates:
    description: Also install the .NET export templates ('true' or 'false')
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates
        key: godot-mono-${{ inputs.export-templates == 'true' && 'templates' || 'editor' }}-${{ inputs.version }}

    - name: Install Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
        TEMPLATES: ${{ inputs.export-templates }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        if [ "$TEMPLATES" = "true" ]; then
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          tpl_dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$tpl_dir"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl_dir/"
        fi

    - name: Locate Godot
      shell: bash
      run: |
        godot="$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n1)"
        chmod +x "$godot"
        echo "GODOT=$godot" >> "$GITHUB_ENV"
        "$godot" --headless --version
